l_english:
 FRACTURED_ISLES:0 "Fractured Isles"
 FRACTURED_ISLES_DESC:0 "The Norman invasion of 1066 did not unfold as elsewhere. Duke William's army failed to subdue the English kingdoms beyond the Weald, leaving only the region around Guildford under permanent Norman rule. Without a conquering elite, English culture never spread past this pocket, and the isle's native cultures survived intact. To the north, @C01 §Wthe Kingdom of Norway§! expanded into the Gaelic highlands and isles, and still rules them directly. §RThe Danelaw§! @A31, once a dominant Norse power, has collapsed to a minor, barely-surviving state. In Wales, the local princes fell not to the English but to §YWealas§! @A46, a kingdom of mixed Anglo-Saxon and Welsh stock, whose Lloegrian rulers now hold most of the region, §Gexcluding Swansea§! @A47, an Irish city-state kept independent under the High King's protection. Northumbria never consolidated into one people, and by 1444 exists as three cultures: Scandinavian, Anglo-Saxon, and Celtic-leaning. Fractured and Fragmented, waiting to be fixed."
 
